name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK version, e.g. 0.2.0
        required: true

permissions:
  contents: write
  packages: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./scripts/release-ios.sh "${{ inputs.version }}"
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -am "build: release ${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD "v${{ inputs.version }}"
      - run: gh release create "v${{ inputs.version }}" core/build/XCFrameworks/release/RmbtSdk.xcframework.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :rmbt-sdk:publishAllPublicationsToGitHubPackagesRepository :rmbt-sdk:publishAllPublicationsToPagesRepository :rmbt-sdk:jsBrowserProductionLibraryDistribution -PsdkVersion="${{ inputs.version }}" -PpagesRepo=pages/maven
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@hadamot"
      - run: npm publish
        working-directory: core/build/dist/js/productionLibrary
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mv "$RUNNER_TEMP"/hadamot-speedtest-sdk-*.tgz "$RUNNER_TEMP/speedtest-sdk-${{ inputs.version }}.tgz"
          gh release upload "v${{ inputs.version }}" "$RUNNER_TEMP/speedtest-sdk-${{ inputs.version }}.tgz"
        working-directory: core/build/dist/js/productionLibrary
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add maven
          git commit -m "build: publish maven ${{ inputs.version }}"
          git push origin gh-pages
        working-directory: pages
